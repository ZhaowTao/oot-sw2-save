[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ootsw2"
version = "0.3.0"
description = "Read and edit save files from The Legend of Zelda: Ocarina of Time (Nintendo Switch 2)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wentao Zhao" }]
keywords = ["zelda", "ocarina-of-time", "save-editor", "switch2", "nintendo", "reverse-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ootsw2 = "ootsw2.cli:main"

[project.urls]
Homepage = "https://github.com/ZhaowTao/oot-sw2-save"
Issues = "https://github.com/ZhaowTao/oot-sw2-save/issues"

[tool.setuptools]
packages = ["ootsw2"]

[tool.setuptools.package-data]
ootsw2 = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
